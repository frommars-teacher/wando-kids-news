anel"></section><section id="results" class="grid"></section><section id="casefile"></section></main><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script>const defaults=[{"id":1,"title":"전국 빈집 14만호 넘어…전남광주 2만3천537호 최다","source":"연합뉴스","date":"2026-10-01","region":"전남·광주","category":"인구·빈집","keywords":["빈집","인구","전남","광주","주거","지역소멸"],"summary":"전남·광주 지역의 빈집이 전국에서 가장 많은 수준으로 나타났습니다. 빈집이 늘면 동네가 어두워지거나 관리가 어려워지고, 생활환경이 나빠질 수 있습니다.","fact":"전남·광주의 빈집은 2만 3,537호로 집계됐고, 전국에서 가장 많았습니다.","cause_hint":"사람이 줄어들거나 다른 지역으로 이사하면서 살지 않는 집이 늘어난 것과 관련이 있을 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20261001025100054?input=1195m","trap":false},{"id":2,"title":"완도군, 올해 70억 투입 해양쓰레기 수거·처리","source":"연합뉴스","date":"2026-03-26","region":"완도","category":"환경","keywords":["완도","바다","쓰레기","해양쓰레기","섬","환경"],"summary":"완도군은 바다와 섬에 쌓이는 해양쓰레기를 치우기 위해 큰 예산을 들여 수거·처리 사업을 진행하고 있습니다.","fact":"지난해 완도 6개 읍면 16개 섬 지역에서 해양쓰레기 400톤을 수거했습니다.","cause_hint":"바다로 떠밀려온 쓰레기, 어업 활동 중 생긴 폐기물 등이 원인일 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20260326124400054","trap":false},{"id":3,"title":"완도군, 632ha 양식 어장 정화 사업 추진","source":"연합뉴스","date":"2026-07-13","region":"완도","category":"환경","keywords":["완도","군외면","달도리","양식장","바다","폐기물","환경"],"summary":"완도 여러 어촌의 양식장 바닥에 쌓인 폐기물을 치우는 사업이 진행됩니다. 군외면 달도리도 대상에 포함됐습니다.","fact":"완도읍·군외면·청산면의 양식 어장 632ha가 정화 사업 대상입니다.","cause_hint":"오랜 양식 활동 과정에서 바닷속에 폐기물이 쌓였기 때문일 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20260713060700054","trap":false},{"id":4,"title":"“의사 보기도 힘들어”…전남 서남권 의료 인프라 개선 시급","source":"연합뉴스","date":"2026-09-01","region":"전남 서남권","category":"의료","keywords":["전남","완도","병원","의사","의료","서남권","섬"],"summary":"전남 서남권은 전문적인 치료를 받기 위해 다른 지역으로 이동해야 하는 경우가 많아 의료 시설과 인력 확충이 필요하다는 지적이 나왔습니다.","fact":"전남 서남권의 의료 인프라 부족 문제가 계속 지적되고 있습니다.","cause_hint":"병원과 전문 의료인력이 충분하지 않고, 지역 사이 이동거리가 길기 때문일 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20260901080300054","trap":false},{"id":5,"title":"“빈집 손쉽게 찾으세요”…강진군, 스마트 플랫폼 가동","source":"연합뉴스","date":"2026-06-26","region":"강진","category":"인구·빈집","keywords":["강진","빈집","인구","주거","귀촌"],"summary":"강진군은 비어 있는 집의 정보를 한곳에서 확인하고 활용할 수 있도록 온라인 서비스를 만들었습니다. 지역의 빈집 문제를 해결하려는 사례입니다.","fact":"빈집 위치와 주변 편의시설 정보를 온라인 지도에서 확인할 수 있게 했습니다.","cause_hint":"빈집이 많아지면서 이를 다시 활용할 방법이 필요해졌기 때문입니다.","url":"https://www.yna.co.kr/view/AKR20260626062100054","trap":false},{"id":6,"title":"완도군, 기후변화 대응 친환경 양식어업 육성 사업 선정","source":"연합뉴스","date":"2026-06-09","region":"완도","category":"환경","keywords":["완도","기후변화","양식","수산","바다"],"summary":"완도군이 기후변화 피해를 줄이고 양식업을 더 안정적으로 운영하기 위해 스마트 양식 시설을 지원받게 됐습니다.","fact":"친환경 양식어업 육성 사업에 선정돼 사업비 50억 원을 확보했습니다.","cause_hint":"바닷물 환경과 기후가 달라지면서 기존 양식 방식만으로 대응하기 어려워졌기 때문입니다.","url":"https://www.yna.co.kr/view/AKR20260609140800054","trap":false},{"id":7,"title":"완도군, 광어 등 어류 양식 지원…경쟁력 강화","source":"연합뉴스","date":"2026-06-01","region":"완도","category":"지역소식","keywords":["완도","광어","양식","수산"],"summary":"완도군이 광어 양식장의 시설과 방역 등을 지원한다는 지역 산업 소식입니다.","fact":"완도는 전국 광어 생산량에서 큰 비중을 차지합니다.","cause_hint":"이 기사는 지역의 특징을 보여주지만, '주민이 불편을 겪는 지역문제'를 직접 보여주는 자료는 아닐 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20260601043600054","trap":true},{"id":8,"title":"완도 지역 기사 ① — 내용 확인 필요","source":"사용자 제공 기사","date":"확인 필요","region":"광주·전남","category":"내용 확인 필요","keywords":["광주","전남","완도","지역문제"],"summary":"이 기사는 선생님이 직접 고른 기사입니다. 현재 자동으로 내용을 확인하지 못해 교사 모드에서 제목과 요약을 수정할 수 있게 해 두었습니다.","fact":"기사 원문을 열어 어떤 지역문제인지 확인해 보세요.","cause_hint":"교사 모드에서 원인 단서를 입력할 수 있습니다.","url":"https://www.mdilbo.com/detail/c3QycN/759153","trap":false},{"id":9,"title":"전남·광주 지역 기사 ② — 내용 확인 필요","source":"사용자 제공 기사","date":"확인 필요","region":"광주·전남","category":"내용 확인 필요","keywords":["광주","전남","지역문제"],"summary":"선생님이 직접 고른 기사입니다. 교사 모드에서 학생용 제목과 요약을 수정해 주세요.","fact":"기사 원문을 열어 어떤 문제가 다뤄지는지 확인해 보세요.","cause_hint":"교사 모드에서 원인 단서를 입력할 수 있습니다.","url":"https://www.m-i.kr/news/articleView.html?idxno=1415647","trap":false},{"id":10,"title":"광주 지역 기사 ③ — 내용 확인 필요","source":"사용자 제공 기사","date":"확인 필요","region":"광주","category":"내용 확인 필요","keywords":["광주","지역문제"],"summary":"선생님이 직접 고른 광주 지역 기사입니다. 교사 모드에서 학생용 정보로 다듬어 사용할 수 있습니다.","fact":"기사 원문을 확인해 보세요.","cause_hint":"교사 모드에서 입력할 수 있습니다.","url":"https://www.gjdream.com/news/articleView.html?idxno=673018","trap":false},{"id":11,"title":"지역 기사 ④ — 내용 확인 필요","source":"사용자 제공 기사","date":"확인 필요","region":"광주·전남","category":"내용 확인 필요","keywords":["광주","전남","지역문제"],"summary":"선생님이 직접 고른 기사입니다. 원문을 확인한 뒤 교사 모드에서 학생용 요약을 넣을 수 있습니다.","fact":"기사 원문 확인이 필요합니다.","cause_hint":"교사 모드에서 입력할 수 있습니다.","url":"https://www.siminilbo.co.kr/news/articleView.html?idxno=402458","trap":false}];let articles=JSON.parse(localStorage.getItem('wando_articles')||JSON.stringify(defaults));let cases=JSON.parse(localStorage.getItem('wando_cases')||'[]');const chips=['쓰레기','교통','안전','바다','의료','빈집','완도','군외면'];function save(){localStorage.setItem('wando_articles',JSON.stringify(articles));localStorage.setItem('wando_cases',JSON.stringify(cases));}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function init(){document.getElementById('chips').innerHTML=chips.map(x=>`<button class="chip" onclick="chip('${x}')">#${x}</button>`).join('');render(articles);renderProgress();renderCasefile();}function chip(x){document.getElementById('q').value=x;search()}function search(){setStep(1,'검색 결과를 보고 지역문제와 직접 관련된 기사인지 판단해 보세요.');const q=document.getElementById('q').value.trim().toLowerCase();if(!q)return render(articles);const terms=q.split(/\s+/);const out=articles.filter(a=>{const hay=[a.title,a.region,a.category,...a.keywords,a.summary].join(' ').toLowerCase();return terms.every(t=>hay.includes(t));});render(out);}function render(list){const box=document.getElementById('results');if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>검색 결과가 없어요.</h3><p>검색어를 조금 바꿔 보세요.<br>예: <b>완도 / 쓰레기 / 병원 / 빈집 / 바다</b></p></div>';return;}box.innerHTML=list.map(a=>`<article class="card" onclick="openArticle(${a.id})"><div class="meta">${esc(a.source)} · ${esc(a.date)} · ${esc(a.region)}</div><span class="badge">${esc(a.category)}</span>${a.trap?'<span class="badge trap">판단 필요</span>':''}<h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p></article>`).join('');}function setStep(n,msg){document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===n-1);el.classList.toggle('done',i<n-1)});document.querySelector('#todo span').textContent=msg;}function openArticle(id){setStep(2,'기사 내용을 읽고 지역문제의 단서를 찾아 수사카드를 작성하세요.');const a=articles.find(x=>x.id===id);const warning=a.trap?'<div class="section" style="background:#fff9db"><b>🤔 잠깐!</b><br>이 기사가 정말 ‘주민들이 겪는 지역문제’를 보여 주는 자료일까요? 제목과 내용을 다시 생각해 보세요.</div>':'';document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">닫기</button><div class="meta">${esc(a.source)} · ${esc(a.date)} · ${esc(a.region)}</div><h2>${esc(a.title)}</h2>${warning}<div class="section"><h4>🧒 어린이용 기사 요약</h4>${esc(a.summary)}</div><div class="section"><h4>🔍 기사에서 확인 가능한 사실</h4>${esc(a.fact)}</div><div class="section"><h4>🧩 원인 추리 힌트</h4>${esc(a.cause_hint)}</div><a class="linkBtn" href="${a.url}" target="_blank" rel="noopener">원래 기사 확인하기 ↗</a><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>🕵️ 지역문제 수사 기록</h3><div class="form"><label>1. 어떤 지역문제인가요?</label><select id="fcat"><option>환경</option><option>교통</option><option>안전</option><option>의료</option><option>인구·빈집</option><option>시설</option><option>기타</option></select><label>2. 어디에서 일어났나요?</label><input id="fwhere" value="${esc(a.region)}"><label>3. 누가 어떤 불편을 겪나요?</label><textarea id="fwho" placeholder="예: 섬 주민들이 병원에 가기 어렵다."></textarea><label>4. 기사에서 확인한 사실은?</label><textarea id="ffact" placeholder="기사에 실제로 나온 내용만 적어 보세요."></textarea><label>5. 내가 추리한 원인은?</label><textarea id="fcause" placeholder="기사에 나온 사실과 내 생각을 구분해 적어 보세요."></textarea><br><button class="primary" onclick="completeCase(${a.id})">수사 완료!</button></div>`;document.getElementById('overlay').style.display='flex';}function closeModal(){document.getElementById('overlay').style.display='none'}function completeCase(id){if(cases.length>=3){alert('수사카드는 3장까지 모을 수 있어요.');return}const a=articles.find(x=>x.id===id);if(cases.some(c=>c.articleId===id)){alert('이미 조사한 기사예요.');return}const item={articleId:id,title:a.title,category:document.getElementById('fcat').value,where:document.getElementById('fwhere').value.trim(),who:document.getElementById('fwho').value.trim(),fact:document.getElementById('ffact').value.trim(),cause:document.getElementById('fcause').value.trim()};if(!item.who||!item.fact||!item.cause){alert('빈칸을 모두 채워 주세요.');return}cases.push(item);save();closeModal();renderProgress();renderCasefile();setStep(cases.length>=3?4:3,cases.length>=3?'세 사건을 비교하고 가장 중요하다고 생각하는 지역문제와 까닭을 정리하세요.':'기사 속 사실과 내가 생각한 원인을 구분해 보세요.');alert('🎉 지역문제 수사카드를 획득했어요!');}function renderProgress(){for(let i=1;i<=3;i++)document.getElementById('d'+i).classList.toggle('on',cases.length>=i);}function renderCasefile(){const box=document.getElementById('casefile');if(!cases.length){box.innerHTML='';return}box.innerHTML=`<div class="casefile"><h2>📁 나의 지역문제 조사파일</h2><div class="caseitems">${cases.map((c,i)=>`<div class="caseitem"><b>사건 ${i+1}</b><br><strong>${esc(c.category)}</strong><br><span class="small">${esc(c.where)}</span><p>${esc(c.who)}</p></div>`).join('')}</div>${cases.length===3?`<div class="form"><label>내가 가장 중요하다고 생각하는 지역문제</label><select id="best">${cases.map(c=>`<option>${esc(c.category)} - ${esc(c.where)}</option>`).join('')}</select><label>그렇게 생각한 까닭</label><textarea id="why" placeholder="왜 이 문제를 먼저 해결해야 한다고 생각하나요?"></textarea><p class="small">📸 이 화면을 태블릿으로 캡처해서 제출해도 좋아요.</p></div>`:`<p class="small">수사카드 ${3-cases.length}장을 더 모아 보세요.</p>`}<button class="secondary" onclick="resetCases()">수사기록 초기화</button></div>`;}function resetCases(){if(confirm('수사기록을 모두 지울까요?')){cases=[];save();renderProgress();renderCasefile();setStep(1,'검색어를 넣고 지역문제와 관련된 기사를 찾아보세요.');}}function toggleTeacher(){const p=document.getElementById('teacherPanel');p.style.display=p.style.display==='block'?'none':'block';renderTeacher();}function renderTeacher(){const p=document.getElementById('teacherPanel');p.innerHTML=`<h3>🧑‍🏫 교사 모드</h3><p class="small">기사 제목·요약·검색어를 수업 상황에 맞게 수정할 수 있습니다. 이 기기 브라우저에만 저장됩니다.</p>${articles.map(a=>`<div class="teacherRow"><div><b>${esc(a.title)}</b><div class="small">${esc(a.region)} · ${esc(a.category)} · 검색어: ${esc(a.keywords.join(', '))}</div></div><button class="secondary" onclick="editArticle(${a.id})">수정</button></div>`).join('')}<div style="margin-top:14px"><button class="primary" onclick="addArticle()">+ 새 기사 추가</button><button class="secondary" onclick="restoreDefaults()">기본 기사로 복원</button></div>`;}function editArticle(id){const a=articles.find(x=>x.id===id);articleEditor(a);}function addArticle(){articleEditor({id:Date.now(),title:'',source:'',date:'',region:'',category:'기타',keywords:[],summary:'',fact:'',cause_hint:'',url:'',trap:false},true);}function articleEditor(a,isNew=false){document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">닫기</button><h2>${isNew?'새 기사 추가':'기사 수정'}</h2><div class="form"><label>제목</label><input id="etitle" value="${esc(a.title)}"><label>언론사</label><input id="esource" value="${esc(a.source)}"><label>날짜</label><input id="edate" value="${esc(a.date)}"><label>지역</label><input id="eregion" value="${esc(a.region)}"><label>문제 유형</label><input id="ecat" value="${esc(a.category)}"><label>검색어 (쉼표로 구분)</label><input id="ekey" value="${esc(a.keywords.join(', '))}"><label>어린이용 요약</label><textarea id="esum">${esc(a.summary)}</textarea><label>기사에서 확인 가능한 사실</label><textarea id="efact">${esc(a.fact)}</textarea><label>원인 단서</label><textarea id="ecause">${esc(a.cause_hint)}</textarea><label>원문 URL</label><input id="eurl" value="${esc(a.url)}"><label><input type="checkbox" id="etrap" ${a.trap?'checked':''} style="width:auto"> 함정/판단 필요 기사</label><button class="primary" onclick="saveArticle(${a.id},${isNew})">저장</button></div>`;document.getElementById('overlay').style.display='flex';}function saveArticle(id,isNew){const a={id,title:document.getElementById('etitle').value.trim(),source:document.getElementById('esource').value.trim(),date:document.getElementById('edate').value.trim(),region:document.getElementById('eregion').value.trim(),category:document.getElementById('ecat').value.trim(),keywords:document.getElementById('ekey').value.split(',').map(x=>x.trim()).filter(Boolean),summary:document.getElementById('esum').value.trim(),fact:document.getElementById('efact').value.trim(),cause_hint:document.getElementById('ecause').value.trim(),url:document.getElementById('eurl').value.trim(),trap:document.getElementById('etrap').checked};if(isNew)articles.push(a);else articles=articles.map(x=>x.id===id?a:x);save();closeModal();render(articles);renderTeacher();}function restoreDefaults(){if(confirm('교사 모드에서 수정한 기사 정보를 모두 기본값으로 되돌릴까요?')){articles=JSON.parse(JSON.stringify(defaults));save();render(articles);renderTeacher();}}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});init();</script></body></html>
