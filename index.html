function cleanText(s){return String(s||'').trim().replace(/\s+/g,' ')}
function weirdText(s){s=cleanText(s);if(!s)return true;if(/^(ㅋ|ㅎ|ㅠ|ㅜ|ㄱ|ㄴ|ㅇ|ㅁ|asdf|qwer|test|몰라|모름|없음|모르겠음)+[.!?~]*$/i.test(s))return true;if(/(.)\1{5,}/.test(s))return true;const letters=(s.match(/[가-힣A-Za-z0-9]/g)||[]).length;return letters<3}
function fieldScore(text,type,a){const s=cleanText(text);if(weirdText(s))return{score:0,msg:'내용이 너무 짧거나 의미를 확인하기 어려워요.'};const chars=(s.match(/[가-힣A-Za-z0-9]/g)||[]).length;if(chars<7)return{score:0,msg:'조금 더 자세히 써야 해요.'};let score=80,bonus=0;const hay=(a.title+' '+a.summary+' '+a.fact+' '+a.cause+' '+a.region+' '+a.category+' '+a.keywords.join(' ')).toLowerCase();const words=s.toLowerCase().split(/[\s,./()]+/).filter(x=>x.length>=2);const overlap=[...new Set(words)].filter(w=>hay.includes(w)).length;if(chars>=15)bonus+=5;if(chars>=25)bonus+=3;if(overlap>=1)bonus+=4;if(overlap>=2)bonus+=3;if(type==='who'&&/(주민|사람|시민|학생|어민|환자|운전자|보행자|상인|관광객|아이|어린이|노인|가족)/.test(s))bonus+=3;if(type==='fact'&&/(톤|명|개|건|%|퍼센트|억|만|천|km|시간|분|ha|헥타르|늘|줄|발생|집계|조사|통제|수거|부족|파손)/i.test(s))bonus+=4;if(type==='cause'&&/(때문|해서|하여|부족|적어서|많아서|낡|멀|없어서|늘어서|줄어서|의존|누수|기후|인구)/.test(s))bonus+=5;score=Math.min(100,score+bonus);return{score,msg:score>=95?'아주 구체적이에요!':score>=90?'좋아요. 기사와 잘 연결했어요.':'좋아요. 핵심은 들어갔어요.'}}
function gradeEntry(a,whoV,factV,causeV){const w=fieldScore(whoV,'who',a),f=fieldScore(factV,'fact',a),ca=fieldScore(causeV,'cause',a);return{who:w,fact:f,cause:ca,total:w.score+f.score+ca.score}}
function collect(id){if(cases.some(x=>x.id===id)){alert('이미 모은 기사예요!');return}const whoV=who.value.trim(),factV=fact.value.trim(),causeV=cause.value.trim();const a=ARTICLES.find(x=>x.id===id);const grade=gradeEntry(a,whoV,factV,causeV);if(grade.who.score===0||grade.fact.score===0||grade.cause.score===0){const bad=[];if(grade.who.score===0)bad.push('불편');if(grade.fact.score===0)bad.push('사실');if(grade.cause.score===0)bad.push('원인');alert('⚠️ '+bad.join(' · ')+' 항목은 0점이에요.\n대충 쓰지 말고 기사 내용을 바탕으로 한 문장 이상 다시 적어 주세요.');return}cases.push({id,title:a.title,cat:fcat.value,where:where.value.trim(),who:whoV,fact:factV,cause:causeV,scores:{who:grade.who.score,fact:grade.fact.score,cause:grade.cause.score,total:grade.total}});localStorage.setItem('wando_cases_v3',JSON.stringify(cases));drawCollection();closeModal();alert('🎉 수집 성공!\n불편 '+grade.who.score+'점 · 사실 '+grade.fact.score+'점 · 원인 '+grade.cause.score+'점\n이번 기사 총점: '+grade.total+'점')}
function drawCollection(){collection.innerHTML=cats.map(c=>{const n=cases.filter(x=>x.cat===c).length;return '<div class="cat '+(n?'on':'')+'">'+c+'<b>'+n+'</b></div>'}).join('');const total=cases.reduce((s,x)=>s+((x.scores&&x.scores.total)||0),0);totalScore.textContent=total+'점';openCases.disabled=cases.length===0;openCases.textContent='내 수집함 보기 ('+cases.length+')'}
function showCases(){const total=cases.reduce((s,x)=>s+((x.scores&&x.scores.total)||0),0);modal.innerHTML='<button class="close" onclick="closeModal()">닫기</button><h2>📚 나의 지역문제 수집함</h2><div class="scoretotal">🏆 누적 총점 '+total+'점</div><p class="small">각 기사는 불편·사실·원인을 각각 100점 만점으로 평가합니다.</p>'+cats.map(c=>{const xs=cases.filter(x=>x.cat===c);return xs.length?'<h3>'+c+' · '+xs.length+'개</h3>'+xs.map(x=>{const sc=x.scores||{who:80,fact:80,cause:80,total:240};return '<div class="case"><b>'+esc(x.title)+'</b><div class="small">'+esc(x.where)+'</div><div class="scoregrid"><div class="scorecell">불편<b>'+sc.who+'</b></div><div class="scorecell">사실<b>'+sc.fact+'</b></div><div class="scorecell">원인<b>'+sc.cause+'</b></div></div><div class="scoretotal">기사 점수 '+sc.total+'점</div><p><b>불편:</b> '+esc(x.who)+'</p><p><b>사실:</b> '+esc(x.fact)+'</p><p><b>원인 추리:</b> '+esc(x.cause)+'</p></div>'}).join(''):''}).join('')+'<button class="secondary" onclick="resetCases()">수집함 초기화</button>';overlay.style.display='flex'}
function resetCases(){if(confirm('모은 수사카드를 모두 지울까요?')){cases=[];localStorage.setItem('wando_cases_v3','[]');drawCollection();closeModal()}}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});init();
</script></body></html>
