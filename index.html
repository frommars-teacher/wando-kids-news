div></div><script>const defaults=[{"id":1,"title":"전국 빈집 14만호 넘어…전남·광주 2만3천537호 최다","source":"연합뉴스","date":"2026-10-01","region":"전남·광주","category":"인구·빈집","keywords":["빈집","인구","전남","광주","주거","지역소멸"],"summary":"전남·광주 지역의 빈집이 전국에서 가장 많은 수준으로 나타났습니다. 사람이 살지 않는 집이 늘면 안전과 동네 환경 관리에도 어려움이 생길 수 있습니다.","fact":"전남·광주의 빈집은 2만 3,537호로 집계돼 전국에서 가장 많았습니다.","cause_hint":"인구 감소, 다른 지역으로의 이동, 오래된 주택 방치 등이 관련될 수 있습니다.","url":"https://www.yna.co.kr/view/AKR20261001025100054?input=1195m","trap":false},{"id":2,"title":"완도군, 해양쓰레기 수거·처리 시스템 구축","source":"연합뉴스","date":"2026-03-27","region":"완도","category":"환경","keywords":["완도","바다","쓰레기","해양쓰레기","섬","환경"],"summary":"완도군은 바다와 섬에 쌓이는 해양쓰레기를 치우기 위해 수거부터 운반·처리까지 이어지는 체계를 만들고 있습니다.","fact":"지난해 완도 6개 읍면 16개 섬 지역에서 해양쓰레기 400톤을 수거했습니다.","cause_hint":"해류를 타고 들어오는 외래 쓰레기와 조업 중 생기는 폐어구 등이 원인으로 제시됐습니다.","url":"https://www.yna.co.kr/view/AKR20260327044400054","trap":false},{"id":3,"title":"완도군, 632ha 양식 어장 정화 사업 추진","source":"연합뉴스","date":"2026-07-13","region":"완도","category":"환경","keywords":["완도","군외면","달도리","양식장","바다","폐기물","환경"],"summary":"완도 여러 어촌의 양식장 바닥에 쌓인 폐기물을 치우는 정화 사업이 진행됩니다. 군외면 달도리도 대상에 포함됐습니다.","fact":"완도읍·군외면·청산면의 양식 어장 632ha가 정화 사업 대상입니다.","cause_hint":"오랜 양식 활동 과정에서 바닷속에 폐기물이 쌓인 것이 문제와 관련 있습니다.","url":"https://www.yna.co.kr/view/AKR20260713060700054","trap":false},{"id":4,"title":"전남 서남권, 전문 치료 받으려 다른 지역 이동 반복","source":"연합뉴스","date":"2026-09-01","region":"전남 서남권","category":"의료","keywords":["전남","완도","병원","의사","의료","서남권","섬"],"summary":"전남 서남권에서는 전문 치료를 받기 위해 다른 지역으로 이동해야 하는 경우가 많아 의료 시설과 인력 확충 필요성이 제기됐습니다.","fact":"완도를 포함한 전남 서남권의 의료 접근성과 전문 의료 인력 부족 문제가 지적됐습니다.","cause_hint":"병원과 전문 의료인력이 충분하지 않고 지역 사이 이동거리가 긴 점이 영향을 줍니다.","url":"https://www.yna.co.kr/view/AKR20260901080300054","trap":false},{"id":5,"title":"전남 주민 조사…전문 의료인력 부족은 여전","source":"연합뉴스","date":"2026-08-24","region":"전남","category":"의료","keywords":["전남","병원","의사","의료","주민","대기시간"],"summary":"전남 주민을 대상으로 한 조사에서 의료서비스의 불편한 점으로 긴 대기시간과 전문 의료인력 부족이 꼽혔습니다.","fact":"의료서비스 불만족 이유 가운데 진료·입원 대기시간 22.9%, 전문 의료인력 부족 13.9%가 조사됐습니다.","cause_hint":"병원 이용 수요에 비해 전문 인력과 진료 여건이 충분하지 않은 점을 생각해 볼 수 있습니다.","url":"https://www.yna.co.kr/amp/view/AKR20260824063800054","trap":false},{"id":6,"title":"강진군, 빈집 정보를 한눈에 보는 스마트 플랫폼 가동","source":"연합뉴스","date":"2026-06-26","region":"강진","category":"인구·빈집","keywords":["강진","빈집","인구","주거","귀촌"],"summary":"강진군은 비어 있는 집을 다시 활용하기 쉽도록 빈집 위치와 주변 정보를 확인할 수 있는 서비스를 만들었습니다.","fact":"빈집 위치와 주변 편의시설 정보를 온라인 지도에서 확인할 수 있게 했습니다.","cause_hint":"지역에 빈집이 늘면서 방치하지 않고 다시 활용할 방법이 필요해졌기 때문입니다.","url":"https://www.yna.co.kr/view/AKR20260626062100054","trap":false},{"id":7,"title":"광주 외곽, 버스 한 번 타려 수십 분…대중교통 선택지 부족","source":"광주드림","date":"2024-10-15","region":"광주","category":"교통","keywords":["광주","버스","대중교통","교통","외곽","승용차","이동"],"summary":"광주 외곽 지역은 버스 노선과 운행 간격 때문에 대중교통 이용이 불편하고, 시민들이 승용차에 의존하기 쉬운 문제가 있다는 기사입니다.","fact":"광주 외곽 일부 지역은 버스를 타기 위해 수십 분 기다려야 하고, 광주의 승용차 수송분담률은 당시 49.4%로 소개됐습니다.","cause_hint":"도시는 넓어졌지만 버스 노선과 대수가 충분히 늘지 않았고, 외곽 지역 교통 접근성이 낮은 점이 원인으로 제시됩니다.","url":"https://www.gjdream.com/news/articleView.html?idxno=649370","trap":false},{"id":8,"title":"광주버스 타고 전남 섬까지…지역통합 대중교통망 추진","source":"연합뉴스","date":"2026-09-15","region":"전남·광주","category":"교통","keywords":["광주","전남","버스","여객선","환승","교통","섬"],"summary":"광주 시내버스와 전남 농어촌버스, 섬 여객선을 이어 하나의 교통 생활권을 만들려는 계획이 추진되고 있습니다.","fact":"광역환승센터를 중심으로 버스·철도·여객선을 연계하고 통합요금과 환승할인 도입을 추진합니다.","cause_hint":"지역마다 교통수단과 요금·환승 체계가 달라 이동이 불편했던 점을 해결하려는 노력입니다.","url":"https://www.yna.co.kr/view/AKR20260915081000054","trap":false},{"id":9,"title":"대중교통 불편할수록 비만율 높아지는 경향","source":"이데일리","date":"2021-12-21","region":"전국 자료","category":"교통","keywords":["교통","대중교통","비만","걷기","건강","농어촌"],"summary":"지역별 자료를 분석한 연구에서 대중교통 만족도가 낮은 지역일수록 비만율이 높은 경향이 나타났습니다. 교통 문제가 건강과도 이어질 수 있다는 보조 자료입니다.","fact":"연구에서는 농어촌 군 지역 비만율이 대도시 구 지역보다 높았고, 대중교통 만족도가 낮을수록 비만율이 높은 경향이 나타났습니다.","cause_hint":"대중교통이 불편하면 정류장까지 걷는 등 일상적인 신체활동이 줄어들 수 있다는 설명이 제시됐습니다.","url":"https://www.edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01938486629280816","trap":false},{"id":10,"title":"광주 도로에 싱크홀…상수도관 누수 추정","source":"연합뉴스","date":"2026-06-12","region":"광주","category":"안전","keywords":["광주","도로","싱크홀","안전","상수도","교통"],"summary":"광주 동구 도로에서 땅 꺼짐 현상이 생겨 일부 차로가 통제됐습니다. 도로 아래 상수도관 누수가 원인으로 추정됐습니다.","fact":"깊이 1.5m, 직경 1m 규모의 싱크홀이 생겼고 출근길 일부 차로 통행이 제한됐습니다.","cause_hint":"도로 아래 상수도관에서 물이 새면서 땅속 흙이 약해진 것으로 추정됐습니다.","url":"https://www.yna.co.kr/view/AKR20260612032700054","trap":false},{"id":11,"title":"광주에서 직접 걸어보니…횡단보도가 무섭다","source":"광주드림","date":"2025-02-18","region":"광주","category":"안전","keywords":["광주","보행","횡단보도","안전","교통","걷기"],"summary":"기자가 광주 도심을 직접 걸으며 보행자가 차 때문에 불안함을 느끼는 여러 상황을 경험한 기사입니다.","fact":"우회전 차량이 보행자 앞을 지나가거나 신호등 없는 횡단보도에서 차량이 멈춰줄지 확신하기 어려운 사례가 소개됐습니다.","cause_hint":"보행자 우선 교통문화가 충분히 자리 잡지 않은 점과 자동차 중심 환경을 원인으로 생각해 볼 수 있습니다.","url":"https://www.gjdream.com/news/articleView.html?idxno=654276","trap":false},{"id":12,"title":"여수서 또 대규모 단수…노후 상수도관 문제 반복","source":"연합뉴스","date":"2026-05-15","region":"여수","category":"시설","keywords":["여수","수도","단수","상수도","노후","시설"],"summary":"여수에서 오래된 상수도관이 파손돼 많은 주민이 오랫동안 수돗물을 사용하지 못하는 일이 반복됐습니다.","fact":"문수동 상수관 파손으로 여러 지역 주민들이 단수 불편을 겪었고, 시설 노후가 반복 사고의 원인으로 지적됐습니다.","cause_hint":"오래된 수도관이 낡아 파손되기 쉬운 상태가 된 것이 중요한 원인입니다.","url":"https://www.yna.co.kr/view/AKR20260515103800054","trap":false},{"id":13,"title":"완도군, 기후변화 대응 친환경 양식어업 육성","source":"연합뉴스","date":"2026-06-09","region":"완도","category":"환경","keywords":["완도","기후변화","양식","수산","바다"],"summary":"완도군이 기후변화로 달라지는 바다 환경에 대응하기 위해 스마트·친환경 양식 시설을 지원하는 사업에 선정됐습니다.","fact":"친환경 양식어업 육성 사업에 선정돼 사업비 50억 원을 확보했습니다.","cause_hint":"수온과 해양환경 변화가 기존 양식업에 부담을 주기 때문에 새로운 대응 방식이 필요합니다.","url":"https://www.yna.co.kr/view/AKR20260609140800054","trap":false},{"id":14,"title":"완도군, 광어 양식 경쟁력 강화 지원","source":"연합뉴스","date":"2026-06-01","region":"완도","category":"지역소식","keywords":["완도","광어","양식","수산"],"summary":"완도군이 광어 양식장의 시설과 방역 등을 지원한다는 지역 산업 소식입니다.","fact":"완도는 전국 광어 생산량에서 큰 비중을 차지합니다.","cause_hint":"지역의 특징을 보여주는 기사이지만 주민들의 불편이나 갈등을 직접 보여주는 '지역문제' 기사인지 판단해 보세요.","url":"https://www.yna.co.kr/view/AKR20260601043600054","trap":true}];let articles=JSON.parse(localStorage.getItem('wando_articles')||JSON.stringify(defaults));let cases=JSON.parse(localStorage.getItem('wando_cases')||'[]');const chips=['쓰레기','교통','안전','바다','의료','빈집','시설','완도','군외면'];function save(){localStorage.setItem('wando_articles',JSON.stringify(articles));localStorage.setItem('wando_cases',JSON.stringify(cases));}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function init(){document.getElementById('chips').innerHTML=chips.map(x=>`<button class="chip" onclick="chip('${x}')">#${x}</button>`).join('');render(articles);renderProgress();renderCasefile();updateCollection();}function chip(x){document.getElementById('q').value=x;search()}function search(){const q=document.getElementById('q').value.trim().toLowerCase();if(!q)return render(articles);const terms=q.split(/\s+/);const out=articles.filter(a=>{const hay=[a.title,a.region,a.category,...a.keywords,a.summary].join(' ').toLowerCase();return terms.every(t=>hay.includes(t));});render(out);}function render(list){const box=document.getElementById('results');if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>검색 결과가 없어요.</h3><p>검색어를 조금 바꿔 보세요.<br>예: <b>완도 / 쓰레기 / 병원 / 빈집 / 바다</b></p></div>';return;}box.innerHTML=list.map(a=>`<article class="card" onclick="openArticle(${a.id})"><div class="meta">${esc(a.source)} · ${esc(a.date)} · ${esc(a.region)}</div><span class="badge">${esc(a.category)}</span>${a.trap?'<span class="badge trap">판단 필요</span>':''}<h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p></article>`).join('');}function updateCollection(){const cats=['환경','교통','안전','의료','인구·빈집','시설'];const el=document.getElementById('collection');if(!el)return;el.innerHTML=cats.map(cat=>{const n=cases.filter(c=>c.category===cat).length;return '<span class="chip" style="'+(n?'background:#e6fcf5;border-color:#12b886;font-weight:800':'')+'">'+cat+' '+(n?'✓ '+n:'0')+'</span>'}).join('')}function openArticle(id){const a=articles.find(x=>x.id===id);const warning=a.trap?'<div class="section" style="background:#fff9db"><b>🤔 잠깐!</b><br>이 기사가 정말 ‘주민들이 겪는 지역문제’를 보여 주는 자료일까요? 제목과 내용을 다시 생각해 보세요.</div>':'';document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">닫기</button><div class="meta">${esc(a.source)} · ${esc(a.date)} · ${esc(a.region)}</div><h2>${esc(a.title)}</h2>${warning}<div class="section"><h4>🧒 어린이용 기사 요약</h4>${esc(a.summary)}</div><div class="section"><h4>🔍 기사에서 확인 가능한 사실</h4>${esc(a.fact)}</div><div class="section"><h4>🧩 원인 추리 힌트</h4>${esc(a.cause_hint)}</div><a class="linkBtn" href="${a.url}" target="_blank" rel="noopener">원래 기사 확인하기 ↗</a><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>🕵️ 지역문제 수사 기록</h3><div class="form"><label>1. 어떤 지역문제인가요?</label><select id="fcat"><option>환경</option><option>교통</option><option>안전</option><option>의료</option><option>인구·빈집</option><option>시설</option><option>기타</option></select><label>2. 어디에서 일어났나요?</label><input id="fwhere" value="${esc(a.region)}"><label>3. 누가 어떤 불편을 겪나요?</label><textarea id="fwho" placeholder="예: 섬 주민들이 병원에 가기 어렵다."></textarea><label>4. 기사에서 확인한 사실은?</label><textarea id="ffact" placeholder="기사에 실제로 나온 내용만 적어 보세요."></textarea><label>5. 내가 추리한 원인은?</label><textarea id="fcause" placeholder="기사에 나온 사실과 내 생각을 구분해 적어 보세요."></textarea><br><button class="primary" onclick="completeCase(${a.id})">수사 완료!</button></div>`;document.getElementById('overlay').style.display='flex';}function closeModal(){document.getElementById('overlay').style.display='none'}function completeCase(id){const a=articles.find(x=>x.id===id);if(cases.some(c=>c.articleId===id)){alert('이미 조사한 기사예요.');return}const item={articleId:id,title:a.title,category:document.getElementById('fcat').value,where:document.getElementById('fwhere').value.trim(),who:document.getElementById('fwho').value.trim(),fact:document.getElementById('ffact').value.trim(),cause:document.getElementById('fcause').value.trim()};if(!item.who||!item.fact||!item.cause){alert('빈칸을 모두 채워 주세요.');return}cases.push(item);save();closeModal();renderProgress();renderCasefile();updateCollection();alert('🎉 지역문제 수사카드를 획득했어요!');}function renderProgress(){updateCollection();}function renderCasefile(){const box=document.getElementById('casefile');updateCollection();if(!cases.length){box.innerHTML='';return}const byCat={};cases.forEach(x=>(byCat[x.category]??=[]).push(x));box.innerHTML='<div class="casefile"><h2>📚 내가 모은 지역문제 도감</h2><p class="small">기사 수집에는 제한이 없어요. 같은 분야도 여러 개 모을 수 있습니다.</p>'+Object.entries(byCat).map(([cat,items])=>'<h3>'+esc(cat)+' <span class="small">'+items.length+'개</span></h3><div class="caseitems">'+items.map((c,i)=>'<div class="caseitem"><b>'+esc(c.title)+'</b><br><span class="small">'+esc(c.where)+'</span><p>'+esc(c.who)+'</p><p class="small"><b>사실:</b> '+esc(c.fact)+'</p><p class="small"><b>원인 추리:</b> '+esc(c.cause)+'</p></div>').join('')+'</div>').join('')+'<div class="form"><label>지금까지 조사한 것 중 가장 중요하다고 생각하는 지역문제</label><select id="best">'+cases.map(c=>'<option>'+esc(c.category)+' - '+esc(c.where)+'</option>').join('')+'</select><label>그렇게 생각한 까닭</label><textarea id="why" placeholder="왜 이 문제를 먼저 해결해야 한다고 생각하나요?"></textarea><p class="small">📸 이 화면을 태블릿으로 캡처해서 제출해도 좋아요.</p></div><button class="secondary" onclick="resetCases()">수사기록 초기화</button></div>';}function resetCases(){if(confirm('수사기록을 모두 지울까요?')){cases=[];save();renderProgress();renderCasefile();updateCollection();}}function toggleTeacher(){const p=document.getElementById('teacherPanel');p.style.display=p.style.display==='block'?'none':'block';renderTeacher();}function renderTeacher(){const p=document.getElementById('teacherPanel');p.innerHTML=`<h3>🧑‍🏫 교사 모드</h3><p class="small">기사 제목·요약·검색어를 수업 상황에 맞게 수정할 수 있습니다. 이 기기 브라우저에만 저장됩니다.</p>${articles.map(a=>`<div class="teacherRow"><div><b>${esc(a.title)}</b><div class="small">${esc(a.region)} · ${esc(a.category)} · 검색어: ${esc(a.keywords.join(', '))}</div></div><button class="secondary" onclick="editArticle(${a.id})">수정</button></div>`).join('')}<div style="margin-top:14px"><button class="primary" onclick="addArticle()">+ 새 기사 추가</button><button class="secondary" onclick="restoreDefaults()">기본 기사로 복원</button></div>`;}function editArticle(id){const a=articles.find(x=>x.id===id);articleEditor(a);}function addArticle(){articleEditor({id:Date.now(),title:'',source:'',date:'',region:'',category:'기타',keywords:[],summary:'',fact:'',cause_hint:'',url:'',trap:false},true);}function articleEditor(a,isNew=false){document.getElementById('modal').innerHTML=`<button class="close" onclick="closeModal()">닫기</button><h2>${isNew?'새 기사 추가':'기사 수정'}</h2><div class="form"><label>제목</label><input id="etitle" value="${esc(a.title)}"><label>언론사</label><input id="esource" value="${esc(a.source)}"><label>날짜</label><input id="edate" value="${esc(a.date)}"><label>지역</label><input id="eregion" value="${esc(a.region)}"><label>문제 유형</label><input id="ecat" value="${esc(a.category)}"><label>검색어 (쉼표로 구분)</label><input id="ekey" value="${esc(a.keywords.join(', '))}"><label>어린이용 요약</label><textarea id="esum">${esc(a.summary)}</textarea><label>기사에서 확인 가능한 사실</label><textarea id="efact">${esc(a.fact)}</textarea><label>원인 단서</label><textarea id="ecause">${esc(a.cause_hint)}</textarea><label>원문 URL</label><input id="eurl" value="${esc(a.url)}"><label><input type="checkbox" id="etrap" ${a.trap?'checked':''} style="width:auto"> 함정/판단 필요 기사</label><button class="primary" onclick="saveArticle(${a.id},${isNew})">저장</button></div>`;document.getElementById('overlay').style.display='flex';}function saveArticle(id,isNew){const a={id,title:document.getElementById('etitle').value.trim(),source:document.getElementById('esource').value.trim(),date:document.getElementById('edate').value.trim(),region:document.getElementById('eregion').value.trim(),category:document.getElementById('ecat').value.trim(),keywords:document.getElementById('ekey').value.split(',').map(x=>x.trim()).filter(Boolean),summary:document.getElementById('esum').value.trim(),fact:document.getElementById('efact').value.trim(),cause_hint:document.getElementById('ecause').value.trim(),url:document.getElementById('eurl').value.trim(),trap:document.getElementById('etrap').checked};if(isNew)articles.push(a);else articles=articles.map(x=>x.id===id?a:x);save();closeModal();render(articles);renderTeacher();}function restoreDefaults(){if(confirm('교사 모드에서 수정한 기사 정보를 모두 기본값으로 되돌릴까요?')){articles=JSON.parse(JSON.stringify(defaults));save();render(articles);renderTeacher();}}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});init();</script></body></html>
